<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap 5 Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<body>

        <h1 class="mb-4 text-center">Pasul 6: Bootstrap 5 Card Gallery</h1>

                        <h5 class="card-title">Card 1</h5>
                        <p class="card-text">O scurtă descriere a acestui card.</p>
                        <a href="#" class="btn btn-primary" aria-label="Navighează la Card 1">Află mai multe</a>
                    </div>
                </div>
            </div>
            
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Card 2</h5>
                        <p class="card-text">O scurtă descriere a acestui card.</p>
                        <button class="btn btn-secondary" aria-label="Confirmare pentru Card 2">Acțiune</button>
                    </div>
                </div>
            </div>
            
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Card 3</h5>
                        <p class="card-text">Conținut adăugat aici.</p>
                        <a href="#" class="btn btn-primary" aria-label="Navighează la Card 3">Află mai multe</a>
                    </div>
                </div>
            </div>
            
            <div class="col-12 col-md-6">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title">Card 4</h5>
                        <p class="card-text">Conținut adăugat aici.</p>
                        <button class="btn btn-secondary" aria-label="Confirmare pentru Card 4">Acțiune</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
