<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laborator 3 - CSS & Layouts</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="brand">BrandName</div>
            <div class="nav-links">
                <a href="#">Link 1</a>
                <a href="#">Link 2</a>
                <a href="#">Link 3</a>
            </div>
        </nav>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2>Sidebar</h2>
            <p>Meniu și informații secundare.</p>
        </aside>

        <main class="main-content">
            <section class="step">
                <h2>Pasul 1: CSS Selectors</h2>
                <p class="important">Acesta este un paragraf important.</p>
            </section>

            <section class="step">
                <h2>Pasul 2: Box Model</h2>
                <div class="card-a">Card A (content-box)</div>
                <div class="card-b">Card B (border-box)</div>
            </section>

            <section class="step">
                <h2>Pasul 4: Six-card gallery (CSS Grid)</h2>
                <div class="gallery">
                    <div class="gallery-item">Card 1</div>
                    <div class="gallery-item">Card 2</div>
                    <div class="gallery-item">Card 3</div>
                    <div class="gallery-item">Card 4</div>
                    <div class="gallery-item">Card 5</div>
                    <div class="gallery-item">Card 6</div>
                </div>
            </section>
        </main>
    </div>
</body>
</html>
